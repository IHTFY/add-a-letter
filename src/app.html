<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/icons/icon.svg" type="image/svg+xml" />
		<link
			rel="icon"
			href="%sveltekit.assets%/icons/favicon-32.png"
			type="image/png"
			sizes="32x32"
		/>
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
		<meta name="apple-mobile-web-app-title" content="Add A Letter" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Add A Letter</title>
		<meta
			name="description"
			content="A word puzzle: add a different letter from A to Z to each of 26 four-letter words and rearrange them into five-letter words."
		/>
		<style>
			/* Installed-app launch: the first paint copies Chrome's launch screen (manifest background,
			   maskable icon at 128px), then launchExit() animates out of it. */
			#launch {
				display: none;
			}
			.launching #launch {
				position: fixed;
				inset: 0;
				z-index: 2147483647;
				display: grid;
				place-items: center;
				background: #16a34a;
			}
			#launch-icon {
				width: 128px;
				height: 128px;
				color: #fff;
			}
		</style>
		<script>
			// Plays once per fresh launch of the installed app: never in a browser tab, on reload, or on return.
			(() => {
				const root = document.documentElement;
				try {
					const nav = performance.getEntriesByType('navigation')[0];
					const app = matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches;
					if (!app || nav?.type !== 'navigate' || sessionStorage.getItem('launched')) return;
					sessionStorage.setItem('launched', '1');
				} catch {
					return;
				}
				root.classList.add('launching');
				let animations = [];
				let skipped = false;
				// Drops the click guard of the last press; a new press replaces it.
				let disarm = () => {};
				// While the copy shows, a tap or key only skips it: nothing behind it reacts.
				const swallow = (event) => {
					event.preventDefault();
					event.stopImmediatePropagation();
					// A touch's click comes after the copy is gone, aimed at whatever is under the finger.
					if (event.type === 'pointerdown' && event.isPrimary && event.button === 0) {
						// With a mouse the copy can vanish before the click fires, so the next press also drops the guard.
						// The 1 s limit counts from the release, not the press, so a long hold stays covered.
						// The last press's timer must not later drop the guard this press arms.
						disarm();
						let timer;
						const spare = () => {
							clearTimeout(timer);
							removeEventListener('click', eat, true);
							removeEventListener('pointercancel', spare);
							removeEventListener('pointerdown', spare, true);
							removeEventListener('pointerup', lifted, true);
						};
						const lifted = (up) => {
							if (up.pointerId === event.pointerId) timer = setTimeout(spare, 1000);
						};
						addEventListener('click', eat, { capture: true, once: true });
						addEventListener('pointercancel', spare);
						addEventListener('pointerdown', spare, true);
						addEventListener('pointerup', lifted, true);
						disarm = spare;
					}
					skipped = true;
					animations.forEach((a) => a.finish());
				};
				const eat = (event) => {
					event.preventDefault();
					event.stopImmediatePropagation();
				};
				const end = () => {
					clearTimeout(fallback);
					removeEventListener('pointerdown', swallow, true);
					removeEventListener('keydown', swallow, true);
					root.classList.remove('launching');
					document.getElementById('launch')?.remove();
				};
				addEventListener('pointerdown', swallow, true);
				addEventListener('keydown', swallow, true);
				// The game never stays hidden behind the copy if it fails to call launchExit.
				const fallback = setTimeout(end, 4000);
				// play(overlay) starts the game's exit and returns its Web Animations.
				window.launchExit = (play) => {
					clearTimeout(fallback);
					const overlay = document.getElementById('launch');
					// Too late: the fallback already removed the copy.
					if (!overlay) return;
					// A tap or key while the game was loading: show it at once.
					if (skipped) return end();
					if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
						try {
							animations = play(overlay);
						} catch {
							animations = [];
						}
					}
					if (!animations?.length) {
						animations = [
							overlay.animate(
								{ opacity: [1, 0] },
								{ duration: 200, easing: 'ease-out', fill: 'forwards' }
							)
						];
					}
					Promise.all(animations.map((a) => a.finished)).then(end, end);
				};
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="launch" aria-hidden="true">
			<svg id="launch-icon" viewBox="0 0 512 512">
				<g transform="translate(256 256) scale(0.8) translate(-262 -256)">
					<g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" fill="none">
						<path stroke-width="44" d="M150 372 240 140 330 372M186 296H294" />
						<path stroke-width="30" d="M382 132v76M344 170h76" />
					</g>
				</g>
			</svg>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
