<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/icons/icon.svg" type="image/svg+xml" />
		<link
			rel="icon"
			href="%sveltekit.assets%/icons/favicon-32.png"
			type="image/png"
			sizes="32x32"
		/>
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
		<meta name="apple-mobile-web-app-title" content="Add A Letter" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Add A Letter</title>
		<meta
			name="description"
			content="A word puzzle: add a different letter from A to Z to each of 26 four-letter words and rearrange them into five-letter words."
		/>
		<style>
			/* Installed-app launch: the first paint copies Chrome's launch screen (manifest background,
			   maskable icon at 128px, name near the bottom), then launchExit() animates out of it. */
			#launch {
				display: none;
			}
			.launching #launch {
				position: fixed;
				inset: 0;
				z-index: 2147483647;
				display: grid;
				place-items: center;
				background: #16a34a;
			}
			#launch-icon {
				width: 128px;
				height: 128px;
				color: #fff;
			}
			#launch-name {
				position: absolute;
				inset: auto 0 56px;
				font:
					24px/1 Roboto,
					system-ui,
					sans-serif;
				text-align: center;
				color: rgb(255 255 255 / 0.87);
			}
		</style>
		<script>
			// Plays once per fresh launch of the installed app: never in a browser tab, on reload, or on return.
			(() => {
				const root = document.documentElement;
				try {
					const nav = performance.getEntriesByType('navigation')[0];
					const app = matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches;
					if (!app || nav?.type !== 'navigate' || sessionStorage.getItem('launched')) return;
					sessionStorage.setItem('launched', '1');
				} catch {
					return;
				}
				root.classList.add('launching');
				const end = () => {
					clearTimeout(fallback);
					root.classList.remove('launching');
					document.getElementById('launch')?.remove();
				};
				// The game never stays hidden behind the copy if it fails to call launchExit.
				const fallback = setTimeout(end, 4000);
				// play(overlay) starts the game's exit and returns its Web Animations.
				window.launchExit = (play) => {
					clearTimeout(fallback);
					const overlay = document.getElementById('launch');
					// Too late: the fallback already removed the copy.
					if (!overlay) return;
					let animations = [];
					if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
						try {
							animations = play(overlay);
						} catch {
							animations = [];
						}
					}
					if (!animations?.length) {
						animations = [
							overlay.animate(
								{ opacity: [1, 0] },
								{ duration: 200, easing: 'ease-out', fill: 'forwards' }
							)
						];
					}
					overlay.addEventListener('pointerdown', () => animations.forEach((a) => a.finish()), {
						once: true
					});
					Promise.all(animations.map((a) => a.finished)).then(end, end);
				};
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="launch" aria-hidden="true">
			<svg id="launch-icon" viewBox="0 0 512 512">
				<g transform="translate(256 256) scale(0.8) translate(-262 -256)">
					<g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" fill="none">
						<path stroke-width="44" d="M150 372 240 140 330 372M186 296H294" />
						<path stroke-width="30" d="M382 132v76M344 170h76" />
					</g>
				</g>
			</svg>
			<span id="launch-name">Add A Letter</span>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
